name: Manual Operational Spikes

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Which disposable spike to run"
        required: true
        type: choice
        options:
          - alphabot
          - opensea
          - onchain
          - telegram
          - x
      opensea_chains:
        description: "OpenSea chain keys/aliases to try"
        required: false
        default: "ethereum,base,robinhood"
        type: string
      onchain_mode:
        description: "On-chain probe mode"
        required: false
        default: "timing"
        type: choice
        options:
          - detect
          - timing
      onchain_chains:
        description: "On-chain chain keys/aliases to try"
        required: false
        default: "ethereum,base,robinhood"
        type: string
      onchain_max_blocks:
        description: "Recent blocks to scan per chain"
        required: false
        default: "2000"
        type: string
      onchain_max_contracts:
        description: "Contracts per chain for deploy-to-first-mint timing"
        required: false
        default: "10"
        type: string
      onchain_max_rpc_calls:
        description: "Hard total JSON-RPC call cap"
        required: false
        default: "500"
        type: string
      x_mode:
        description: "X bounded mode. both has a $0.10 Post-read ceiling at current public pricing"
        required: false
        default: "both"
        type: choice
        options:
          - search
          - stream
          - both
      x_query:
        description: "X recent-search query (max 10 returned Posts)"
        required: false
        default: "from:opensea (mint OR drop OR allowlist) -is:retweet"
        type: string
      x_stream_query:
        description: "Temporary Filtered Stream smoke rule (max 10 delivered Posts)"
        required: false
        default: "NFT lang:en -is:retweet"
        type: string
      paid_x_confirmation:
        description: "For X only, type exactly: I_UNDERSTAND_X_MAY_COST"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  alphabot:
    if: ${{ inputs.probe == 'alphabot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Alphabot disposable allowlist-flow probe
        env:
          ALPHABOT_API_KEY: ${{ secrets.ALPHABOT_API_KEY }}
        run: python spikes/alphabot_probe.py --max-requests 6

  opensea:
    if: ${{ inputs.probe == 'opensea' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenSea disposable probe
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          OPENSEA_CHAINS: ${{ inputs.opensea_chains }}
        run: python spikes/opensea_probe.py --chains "$OPENSEA_CHAINS" --limit 30 --detail-limit 10

  onchain:
    if: ${{ inputs.probe == 'onchain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run disposable on-chain mint timing probe
        env:
          ONCHAIN_MODE: ${{ inputs.onchain_mode }}
          ONCHAIN_CHAINS: ${{ inputs.onchain_chains }}
          ONCHAIN_MAX_BLOCKS: ${{ inputs.onchain_max_blocks }}
          ONCHAIN_MAX_CONTRACTS: ${{ inputs.onchain_max_contracts }}
          ONCHAIN_MAX_RPC_CALLS: ${{ inputs.onchain_max_rpc_calls }}
        run: >-
          python spikes/onchain_probe.py
          --mode "$ONCHAIN_MODE"
          --chains "$ONCHAIN_CHAINS"
          --max-blocks "$ONCHAIN_MAX_BLOCKS"
          --max-contracts "$ONCHAIN_MAX_CONTRACTS"
          --max-rpc-calls "$ONCHAIN_MAX_RPC_CALLS"

  telegram:
    if: ${{ inputs.probe == 'telegram' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Telegram disposable delivery probe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPIKE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: python spikes/telegram_probe.py --send

  x:
    if: ${{ inputs.probe == 'x' && inputs.paid_x_confirmation == 'I_UNDERSTAND_X_MAY_COST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run guarded bounded X paid-access probe
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_MODE: ${{ inputs.x_mode }}
          X_QUERY: ${{ inputs.x_query }}
          X_STREAM_QUERY: ${{ inputs.x_stream_query }}
        run: >-
          python spikes/x_probe.py
          --mode "$X_MODE"
          --query "$X_QUERY"
          --stream-query "$X_STREAM_QUERY"
          --stream-seconds 45
          --execute-paid

  x-not-confirmed:
    if: ${{ inputs.probe == 'x' && inputs.paid_x_confirmation != 'I_UNDERSTAND_X_MAY_COST' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unconfirmed paid X probe
        run: |
          echo "X probe not run. Current design ceiling is $0.10 in both mode, but explicit opt-in is still required."
          echo "Enter exactly I_UNDERSTAND_X_MAY_COST in workflow_dispatch."
          exit 2
